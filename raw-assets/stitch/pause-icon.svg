<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pauseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    <filter id="glowPause" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#1c1a25" />
  <rect x="30" y="25" width="12" height="50" rx="6" fill="url(#pauseGrad)" filter="url(#glowPause)" />
  <rect x="58" y="25" width="12" height="50" rx="6" fill="url(#pauseGrad)" filter="url(#glowPause)" />
</svg>