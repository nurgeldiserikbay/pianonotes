<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="closeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
    <filter id="glowClose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#1c1a25" />
  <g transform="rotate(45 50 50)" filter="url(#glowClose)">
    <rect x="44" y="20" width="12" height="60" rx="6" fill="url(#closeGrad)" />
    <rect x="20" y="44" width="60" height="12" rx="6" fill="url(#closeGrad)" />
  </g>
</svg>